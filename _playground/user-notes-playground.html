<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echo · User Notes — layout concepts</title>
<style>
  :root {
    --bg:#0e1014; --panel:#16191f; --panel-2:#1b1f27; --border:#262b34; --border-light:#323a47;
    --text:#e6e9ef; --text-dim:#aab2c0; --faint:#7b8494;
    --accent:#7c9cff; --accent-dim:rgba(124,156,255,.16);
    --note:#c792ea; --note-dim:rgba(199,146,234,.16);
    --good:#5ec98a; --red:#ff5f57;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:var(--sans); background:var(--bg); color:var(--text); font-size:13px; height:100vh; overflow:hidden; }

  .topbar { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--border); background:var(--panel); }
  .logo { width:22px; height:22px; border-radius:6px; background:linear-gradient(135deg,var(--accent),var(--note)); display:grid; place-items:center; font-weight:700; font-size:12px; color:#0e1014; }
  .topbar h1 { font-size:14px; font-weight:600; }
  .topbar .sub { color:var(--faint); font-size:12px; }
  .topbar .spacer { flex:1; }
  .presets { display:flex; gap:6px; }
  .preset { background:var(--panel-2); border:1px solid var(--border); color:var(--text-dim); border-radius:999px; padding:4px 11px; font-size:12px; cursor:pointer; }
  .preset:hover { border-color:var(--accent); color:var(--text); }

  .layout { display:grid; grid-template-columns:320px 1fr; height:calc(100vh - 43px); }
  .controls { border-right:1px solid var(--border); background:var(--panel); overflow-y:auto; padding:14px; }
  .group { margin-bottom:16px; }
  .glabel { font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); margin-bottom:8px; }

  /* concept cards */
  .concept-card { border:1px solid var(--border); background:var(--panel-2); border-radius:9px; padding:10px 11px; margin-bottom:8px; cursor:pointer; transition:all .12s; position:relative; }
  .concept-card:hover { border-color:var(--border-light); }
  .concept-card.active { border-color:var(--accent); background:var(--accent-dim); }
  .concept-card .cc-h { font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:7px; }
  .concept-card .cc-key { display:inline-grid; place-items:center; width:18px; height:18px; border-radius:5px; background:var(--border); color:var(--text); font-size:11px; font-weight:700; }
  .concept-card.active .cc-key { background:var(--accent); color:#0e1014; }
  .concept-card .cc-d { color:var(--text-dim); font-size:11.5px; margin-top:4px; line-height:1.45; }
  .rec-badge { position:absolute; top:9px; right:9px; font-size:8.5px; font-weight:700; letter-spacing:.04em; color:var(--good); background:rgba(94,201,138,.14); border-radius:5px; padding:1px 6px; }

  textarea { width:100%; background:var(--panel-2); border:1px solid var(--border); border-radius:7px; color:var(--text); font-family:var(--sans); font-size:12.5px; line-height:1.45; padding:8px 9px; resize:vertical; outline:none; }
  textarea:focus { border-color:var(--accent); }
  textarea::placeholder { color:var(--faint); }
  .notes-ta { border-color:var(--note); }
  .sub-l { color:var(--faint); font-weight:400; text-transform:none; letter-spacing:0; }

  .toggles { display:flex; flex-direction:column; gap:9px; }
  .toggle { display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; }
  .toggle input { accent-color:var(--accent); width:14px; height:14px; }
  .toggle .t-text { font-size:12.5px; color:var(--text-dim); }

  /* stage */
  .preview { display:flex; flex-direction:column; overflow:hidden; }
  .stagebar { display:flex; align-items:center; gap:10px; padding:9px 14px; border-bottom:1px solid var(--border); background:var(--panel); }
  .seg { display:flex; gap:3px; background:var(--panel-2); padding:3px; border-radius:8px; border:1px solid var(--border); }
  .seg button { background:transparent; border:none; color:var(--faint); font-size:11.5px; padding:5px 11px; border-radius:5px; cursor:pointer; font-family:var(--sans); }
  .seg button.active { background:var(--accent); color:#0e1014; font-weight:600; }
  .stagebar .spacer { flex:1; }
  .stagebar .legend { font-size:11.5px; color:var(--faint); }

  .stage { flex:1; overflow:auto; position:relative;
    background:
      radial-gradient(900px 500px at 70% -10%, #1c2230 0%, transparent 60%),
      radial-gradient(700px 500px at 0% 110%, #1a1726 0%, transparent 55%),
      #0b0d11;
    display:flex; align-items:center; justify-content:center; padding:30px; }
  .compare-wrap { display:flex; gap:26px; align-items:flex-start; justify-content:center; flex-wrap:wrap; }
  .compare-col { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .compare-col .ctitle { font-size:11.5px; color:var(--text-dim); display:flex; align-items:center; gap:6px; }
  .compare-col.sel .ctitle { color:var(--text); font-weight:600; }
  .compare-col .ckey { display:inline-grid; place-items:center; width:16px; height:16px; border-radius:4px; background:var(--border); font-size:10px; font-weight:700; }
  .compare-col.sel .ckey { background:var(--accent); color:#0e1014; }
  .scalebox { transform-origin:top center; }

  /* ===== shared mock primitives ===== */
  .win { background:rgba(22,25,31,.94); backdrop-filter:blur(18px); border:1px solid var(--border-light);
    box-shadow:0 22px 60px rgba(0,0,0,.55); color:var(--text); overflow:hidden;
    transition:width .32s cubic-bezier(.22,1,.36,1), height .32s cubic-bezier(.22,1,.36,1); }
  .pcontrols { display:flex; align-items:center; gap:9px; height:46px; padding:0 11px; }
  .recdot { width:9px; height:9px; border-radius:50%; background:var(--red); box-shadow:0 0 0 3px rgba(255,95,87,.18); animation:pulse 1.6s infinite; flex:none; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.45} }
  .timer { font-variant-numeric:tabular-nums; color:var(--text); font-size:13px; }
  .recbtn { display:inline-flex; align-items:center; gap:7px; background:var(--panel-2); border:1px solid var(--border); color:var(--text); border-radius:999px; padding:5px 11px; font-size:12px; }
  .recbtn .d { width:8px; height:8px; border-radius:50%; background:var(--red); }
  .ic-mic { width:15px; height:18px; position:relative; flex:none; opacity:.8; }
  .ic-mic:before { content:""; position:absolute; left:3.5px; top:0; width:8px; height:11px; border-radius:4px; background:var(--text-dim); }
  .ic-mic:after { content:""; position:absolute; left:0; top:8px; width:15px; height:8px; border-bottom:1.5px solid var(--text-dim); border-left:1.5px solid var(--text-dim); border-right:1.5px solid var(--text-dim); border-radius:0 0 7px 7px; }
  .stopbtn { width:20px; height:20px; border-radius:6px; background:var(--red); border:none; flex:none; }
  .stopbtn:after { content:""; display:block; width:8px; height:8px; background:#fff; margin:6px auto; border-radius:2px; }
  .grow1 { flex:1; }
  .chev { color:var(--faint); font-size:11px; }

  .addnotes { background:var(--panel-2); border:1px dashed var(--border-light); color:var(--text-dim); border-radius:7px; padding:5px 10px; font-size:11.5px; white-space:nowrap; }
  .addnotes.filled { border-style:solid; border-color:var(--note); color:var(--text); background:var(--note-dim); }
  .cbadge { display:inline-block; margin-left:5px; background:var(--note-dim); color:var(--note); border-radius:8px; padding:0 6px; font-size:9px; font-weight:700; }

  .hr { height:1px; background:var(--border); }
  .fld { display:flex; flex-direction:column; gap:5px; }
  .fld.grow { flex:1; min-height:0; }
  .lbl { font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); }
  .lbl.note { color:var(--note); }
  .inp { background:var(--panel-2); border:1px solid var(--border); border-radius:6px; padding:7px 9px; font-size:12px; white-space:pre-wrap; color:var(--text); line-height:1.4; }
  .inp.ph { color:var(--faint); }
  .inp.notes { border-color:var(--note); flex:1; min-height:96px; }
  .inp.notes.slim { min-height:70px; }
  .chips { display:flex; flex-direction:column; gap:4px; }
  .chip { display:flex; align-items:center; justify-content:space-between; background:var(--panel-2); border:1px solid var(--border); border-radius:5px; padding:3px 8px; font-size:11px; }
  .chip .x { color:var(--faint); }
  .hint { font-size:10px; color:var(--faint); }

  /* Concept A — anchored popover (two surfaces) */
  .A-pill { border-radius:999px; }
  .A-pop { margin-top:10px; width:288px; border-radius:12px; padding:11px; display:flex; flex-direction:column; gap:8px; }
  .A-stack { display:flex; flex-direction:column; align-items:flex-start; }
  .A-anchor { width:1px; height:9px; background:var(--border-light); margin-left:26px; }

  /* Concept B — pill expands into portrait (one surface) */
  .B-win { border-radius:18px; width:212px; height:46px; }
  .B-win.expanded { width:320px; height:462px; border-radius:16px; }
  .B-body { padding:0 12px 12px; display:flex; flex-direction:column; gap:9px; height:calc(100% - 46px); opacity:0; transition:opacity .2s .12s; }
  .B-win.expanded .B-body { opacity:1; }
  .B-body .hr { margin:0 -12px 3px; }

  /* Concept C — compact inline column (narrow) */
  .C-win { border-radius:16px; width:212px; height:46px; }
  .C-win.expanded { height:386px; border-radius:14px; }
  .C-body { padding:2px 10px 11px; display:flex; flex-direction:column; gap:8px; height:calc(100% - 46px); opacity:0; transition:opacity .2s .1s; }
  .C-win.expanded .C-body { opacity:1; }

  .collapsed-hint { margin-top:14px; font-size:11.5px; color:var(--faint); text-align:center; max-width:280px; }

  /* prompt bar */
  .promptbar { border-top:1px solid var(--border); background:var(--panel); padding:12px 14px; }
  .promptbar .head { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .promptbar .glabel { margin:0; }
  .promptbar .spacer { flex:1; }
  .copybtn { background:var(--accent); color:#0e1014; border:none; border-radius:7px; padding:6px 13px; font-size:12px; font-weight:600; cursor:pointer; font-family:var(--sans); }
  .copybtn.copied { background:var(--good); }
  .promptout { font-family:var(--mono); font-size:11.5px; line-height:1.55; color:var(--text-dim); background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:11px 12px; max-height:128px; overflow-y:auto; white-space:pre-wrap; }
  ::-webkit-scrollbar { width:9px; height:9px; }
  ::-webkit-scrollbar-thumb { background:var(--border-light); border-radius:5px; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="logo">E</div>
    <h1>User Notes — layout concepts</h1>
    <span class="sub">ID-005 · pick the capture-window shape</span>
    <div class="spacer"></div>
    <div class="presets" id="presets"></div>
  </div>

  <div class="layout">
    <div class="controls">
      <div class="group">
        <div class="glabel">Concept</div>
        <div id="concepts"></div>
      </div>

      <div class="group">
        <div class="glabel">Attendees <span class="sub-l">one per line</span></div>
        <textarea id="attendees" rows="2" placeholder="Alice Chen&#10;Bob Martinez" spellcheck="false"></textarea>
      </div>
      <div class="group">
        <div class="glabel" style="color:var(--note)">✎ Your notes</div>
        <textarea id="notes" rows="4" class="notes-ta" placeholder="Decision: ship v1.1 Friday.&#10;Chris owns the migration script."></textarea>
      </div>

      <div class="group">
        <div class="glabel">State</div>
        <div class="toggles">
          <label class="toggle"><input type="checkbox" id="recording" checked><span class="t-text">Recording in progress</span></label>
          <label class="toggle"><input type="checkbox" id="expanded" checked><span class="t-text">Notes open / expanded</span></label>
        </div>
      </div>
    </div>

    <div class="preview">
      <div class="stagebar">
        <div class="seg" id="viewmode">
          <button data-v="focus" class="active">Focus</button>
          <button data-v="compare">Compare all 3</button>
        </div>
        <span class="spacer"></span>
        <span class="legend" id="legend"></span>
      </div>

      <div class="stage" id="stage"></div>

      <div class="promptbar">
        <div class="head">
          <span class="glabel">Implement this concept</span>
          <span class="legend" style="font-size:11px">paste into Claude to build the selected layout</span>
          <span class="spacer"></span>
          <button class="copybtn" id="copy">Copy prompt</button>
        </div>
        <div class="promptout" id="promptout"></div>
      </div>
    </div>
  </div>

<script>
"use strict";

const state = { concept:"B", attendees:[], notes:"", recording:true, expanded:true, view:"focus" };

const CONCEPTS = {
  A: { key:"A", name:"Anchored popover", tag:"current build",
       short:"Pill stays tiny; notes float in a separate panel beside it.",
       legend:"Two surfaces — a small pill plus a detached 288px notes panel anchored below it." },
  B: { key:"B", name:"Pill → portrait", tag:"recommended",
       short:"The pill grows in place into one portrait window; controls pinned on top, notes fill the body.",
       legend:"One window. The pill becomes the header; below a divider sit attendees + a tall notes field." },
  C: { key:"C", name:"Compact column", tag:"",
       short:"Pill expands downward at its narrow width — fields stacked. Smallest footprint.",
       legend:"One narrow window. Pill on top, slim attendees + notes stacked beneath. Stays out of the way." },
};

const PRESETS = {
  "Weekly standup": { attendees:"Alice Chen\nBob Martinez\nCarol Park", notes:"Decision: ship v1.1 on Friday.\nChris owns the migration script.\nBlocked on design sign-off." },
  "Client call": { attendees:"Dana Wu\nMarcus Reed (Acme)", notes:"Acme wants SSO before they sign.\nSend revised quote by Tuesday." },
  "Solo memo": { attendees:"", notes:"Idea: add retry with backoff to upload.\nFollow up with Sam re: pricing." },
};

function esc(s){ return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function parseNames(raw){ return raw.split(/[\n,]/).map(s=>s.trim()).filter(Boolean); }

// ---- shared mock fragments ----
function pillControls(){
  if(state.recording){
    return '<div class="pcontrols">'
      + '<span class="recdot"></span><span class="timer">12:30</span>'
      + '<span class="grow1"></span><span class="ic-mic"></span><button class="stopbtn"></button>'
      + '</div>';
  }
  return '<div class="pcontrols"><button class="recbtn"><span class="d"></span> Record</button><span class="grow1"></span><span class="ic-mic"></span></div>';
}
function addNotesBtn(){
  const c = state.attendees.length, hasN = state.notes.trim().length>0;
  if(c || hasN) return '<button class="addnotes filled">Notes'+(c?'<span class="cbadge">'+c+'</span>':'')+'</button>';
  return '<button class="addnotes">+ Add notes</button>';
}
function attField(){
  const att = state.attendees;
  const body = att.length ? esc(att.join("\n")) : "Alice Chen\nBob Martinez";
  const chips = att.length ? '<div class="chips">'+att.map(n=>'<div class="chip">'+esc(n)+'<span class="x">×</span></div>').join("")+'</div>' : "";
  return '<div class="fld"><div class="lbl">Attendees</div><div class="inp '+(att.length?'':'ph')+'">'+body+'</div>'+chips+'</div>';
}
function notesField(slim){
  const n = state.notes.trim();
  const body = n ? esc(state.notes) : "Context, decisions, actions to highlight…";
  return '<div class="fld grow"><div class="lbl note">Your notes</div><div class="inp notes '+(n?'':'ph')+(slim?' slim':'')+'">'+body+'</div></div>';
}

// ---- concept renderers ----
function renderA(){
  const open = state.expanded;
  let h = '<div class="A-stack">';
  h += '<div class="win A-pill"><div class="pcontrols" style="gap:9px">'+
       (state.recording?'<span class="recdot"></span><span class="timer">12:30</span>':'<button class="recbtn"><span class="d"></span> Record</button>')+
       '<span class="grow1"></span><span class="ic-mic"></span>'+(state.recording?'<button class="stopbtn"></button>':'')+
       '</div></div>';
  if(open){
    h += '<div class="A-anchor"></div>';
    h += '<div class="win A-pop">'+attField()+'<div class="hr"></div>'+notesField(false)+'<div class="hint">Notes prioritized in the summary · Esc to close</div></div>';
  } else {
    // collapsed: show the add-notes affordance under the pill row
    h = '<div class="A-stack"><div class="win A-pill" style="padding-right:9px"><div class="pcontrols">'+
        (state.recording?'<span class="recdot"></span><span class="timer">12:30</span>':'<button class="recbtn"><span class="d"></span> Record</button>')+
        '<span class="grow1"></span>'+addNotesBtn()+'<span class="ic-mic"></span>'+(state.recording?'<button class="stopbtn"></button>':'')+
        '</div></div></div>';
  }
  h += '</div>';
  return h;
}
function renderB(){
  const open = state.expanded;
  let h = '<div class="win B-win'+(open?' expanded':'')+'">';
  h += '<div class="hdr">'+pillControls()+'</div>';
  h += '<div class="B-body"><div class="hr"></div>'+attField()+notesField(false)+'<div class="hint">Notes prioritized in the summary</div></div>';
  h += '</div>';
  if(!open && !state.recording) h = '<div class="win B-win"><div class="pcontrols"><button class="recbtn"><span class="d"></span> Record</button><span class="grow1"></span>'+addNotesBtn()+'<span class="ic-mic"></span></div></div>';
  else if(!open) h = '<div class="win B-win"><div class="pcontrols"><span class="recdot"></span><span class="timer">12:30</span><span class="grow1"></span>'+addNotesBtn()+'<span class="stopbtn"></span></div></div>';
  return h;
}
function renderC(){
  const open = state.expanded;
  let h = '<div class="win C-win'+(open?' expanded':'')+'">';
  h += '<div class="hdr">'+pillControls()+'</div>';
  h += '<div class="C-body"><div class="hr"></div>'+attField()+notesField(true)+'</div>';
  h += '</div>';
  if(!open) h = '<div class="win C-win"><div class="pcontrols">'+
       (state.recording?'<span class="recdot"></span><span class="timer">12:30</span>':'<button class="recbtn"><span class="d"></span> Record</button>')+
       '<span class="grow1"></span>'+addNotesBtn()+(state.recording?'<button class="stopbtn"></button>':'<span class="ic-mic"></span>')+'</div></div>';
  return h;
}
function renderConcept(which){
  return which==="A"?renderA():which==="B"?renderB():renderC();
}

// ---- stage ----
function renderStage(){
  const stage = document.getElementById("stage");
  if(state.view==="compare"){
    let h = '<div class="compare-wrap">';
    for(const k of ["A","B","C"]){
      const sel = k===state.concept;
      h += '<div class="compare-col'+(sel?' sel':'')+'">'
        + '<div class="ctitle"><span class="ckey">'+k+'</span>'+CONCEPTS[k].name+'</div>'
        + '<div class="scalebox" style="transform:scale('+(sel?0.82:0.72)+')">'+renderConcept(k)+'</div>'
        + '</div>';
    }
    h += '</div>';
    stage.innerHTML = h;
  } else {
    let h = '<div style="display:flex;flex-direction:column;align-items:center">';
    h += '<div class="scalebox" style="transform:scale(1.05)">'+renderConcept(state.concept)+'</div>';
    if(!state.expanded) h += '<div class="collapsed-hint">Collapsed. Toggle <b style="color:var(--text)">Notes open</b> to watch '+CONCEPTS[state.concept].name+' expand.</div>';
    h += '</div>';
    stage.innerHTML = h;
  }
  document.getElementById("legend").textContent = CONCEPTS[state.concept].legend;
}

// ---- implementation prompt ----
function buildPrompt(){
  const c = state.concept;
  const lines = [];
  if(c==="A"){
    lines.push("Keep Echo's current two-window approach for the notes UI: a separate frameless popover window (captureAttendeesWindow) anchored below the recording pill.");
    lines.push("");
    lines.push("The pill stays at its compact size. Clicking \"+ Add notes\" shows the 288px portrait popover with the attendee field on top and a large \"Your notes\" field below. Mirror edits to the pill via IPC; the popover stays open during recording (no hide-on-blur).");
  } else if(c==="B"){
    lines.push("Make the capture pill expand IN PLACE into a single portrait window — do not use a second window.");
    lines.push("");
    lines.push("Keep the pill's controls (record/stop, timer, mic) pinned as a header row across the top. Below a divider, show the attendees field and a tall \"Your notes\" field that fills the remaining height. Collapsing returns it to the compact pill.");
    lines.push("");
    lines.push("Implementation: grow the existing captureWindow height/width (e.g. ~320×462 expanded vs the ~212×46 pill) with setBounds + animate, instead of opening captureAttendeesWindow. Mind the fixed pill-height constants (PILL_HEIGHT, PILL_HEIGHT_WITH_TITLE) and that this is the same window carrying backgroundThrottling:false.");
  } else {
    lines.push("Expand the pill DOWNWARD at its current narrow width into a tall column — one window, ~212px wide.");
    lines.push("");
    lines.push("Pill controls stay on top; beneath them, stack a slim attendees input and a notes textarea, mirroring the existing title-row expansion pattern. Smallest screen footprint of the three.");
    lines.push("");
    lines.push("Implementation: grow captureWindow height only (~212×386 expanded), reuse the pill-title expand/collapse plumbing, keep width = PILL_WIDTH.");
  }
  lines.push("");
  lines.push("Backend is unchanged from ID-005: notes mirror to the pill on every keystroke, ride the finalize POST as userNotes, get HIGH-PRIORITY treatment in the structurer, and land verbatim in a `## My Notes` section before the transcript.");
  if(state.attendees.length || state.notes.trim()){
    lines.push("");
    lines.push("Sample content shown: attendees ["+ state.attendees.join(", ") +"]; notes: \""+ state.notes.trim().replace(/\s+/g," ").slice(0,80) +"…\"");
  }
  return lines.join("\n");
}

// ---- wire up ----
function updateAll(){
  state.attendees = parseNames(document.getElementById("attendees").value);
  state.notes = document.getElementById("notes").value;
  state.recording = document.getElementById("recording").checked;
  state.expanded = document.getElementById("expanded").checked;
  renderConceptCards();
  renderStage();
  document.getElementById("promptout").textContent = buildPrompt();
}

function renderConceptCards(){
  const wrap = document.getElementById("concepts");
  wrap.innerHTML = "";
  for(const k of ["A","B","C"]){
    const c = CONCEPTS[k];
    const div = document.createElement("div");
    div.className = "concept-card"+(k===state.concept?" active":"");
    div.innerHTML = '<div class="cc-h"><span class="cc-key">'+k+'</span>'+c.name+'</div>'
      + (c.tag?'<span class="rec-badge">'+c.tag+'</span>':"")
      + '<div class="cc-d">'+c.short+'</div>';
    div.addEventListener("click",()=>{ state.concept=k; updateAll(); });
    wrap.appendChild(div);
  }
}

["attendees","notes"].forEach(id=>document.getElementById(id).addEventListener("input",updateAll));
["recording","expanded"].forEach(id=>document.getElementById(id).addEventListener("change",updateAll));
document.getElementById("viewmode").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  state.view=b.dataset.v;
  [...e.currentTarget.children].forEach(c=>c.classList.toggle("active",c===b));
  renderStage();
});
document.getElementById("copy").addEventListener("click",()=>{
  navigator.clipboard.writeText(buildPrompt()).then(()=>{
    const b=document.getElementById("copy"); b.classList.add("copied"); b.textContent="Copied!";
    setTimeout(()=>{ b.classList.remove("copied"); b.textContent="Copy prompt"; },1400);
  });
});

const presetsEl=document.getElementById("presets");
Object.keys(PRESETS).forEach(name=>{
  const b=document.createElement("button"); b.className="preset"; b.textContent=name;
  b.addEventListener("click",()=>{
    document.getElementById("attendees").value=PRESETS[name].attendees;
    document.getElementById("notes").value=PRESETS[name].notes;
    updateAll();
  });
  presetsEl.appendChild(b);
});

document.getElementById("attendees").value=PRESETS["Weekly standup"].attendees;
document.getElementById("notes").value=PRESETS["Weekly standup"].notes;
updateAll();
</script>
</body>
</html>
